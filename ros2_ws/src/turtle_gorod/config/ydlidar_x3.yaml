ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB1
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    sample_rate: 3
    abnormal_check_count: 4
    fixed_resolution: true
    # Measured on the robot: with reversion=false, an object physically
    # in front appeared at about -179 deg while an object on the right
    # appeared at about +90 deg. reversion=true applies the required
    # 180-degree scan rotation at the source so consumers such as the
    # collision guard see front at 0 deg. Keep inverted=true to preserve
    # the measured counter-clockwise angle convention.
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: true
    intensity: false
    intensity_bit: 0
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    # Keep the full reliable range available to AMCL. Long wall returns
    # materially improve localization on a sparse competition field.
    range_max: 8.0
    range_min: 0.10
    frequency: 5.0
    invalid_range_is_inf: false
    debug: false
