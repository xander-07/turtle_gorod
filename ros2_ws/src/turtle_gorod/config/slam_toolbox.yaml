slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: mapping
    resolution: 0.02
    max_laser_range: 7.5
    minimum_time_interval: 0.15
    transform_publish_period: 0.03
    map_update_interval: 1.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.04
    minimum_travel_heading: 0.04
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.1
    loop_search_maximum_distance: 2.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.4
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05
