amcl:
  ros__parameters:
    use_sim_time: false
    # Slightly higher odometry noise lets AMCL recover from wheel slip on tile
    # instead of over-trusting encoder motion.
    alpha1: 0.12
    alpha2: 0.12
    alpha3: 0.18
    alpha4: 0.18
    alpha5: 0.08
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    min_particles: 700
    max_particles: 3000
    pf_err: 0.04
    pf_z: 0.99
    update_min_d: 0.03
    update_min_a: 0.03
    resample_interval: 1
    laser_model_type: likelihood_field
    laser_max_range: 7.5
    laser_min_range: 0.10
    laser_likelihood_max_dist: 1.2
    # Trust the LiDAR slightly more than odometry on the competition field.
    z_hit: 0.82
    z_rand: 0.18
    sigma_hit: 0.13
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.08
      use_astar: true
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.04
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      # We deliberately do not demand an exact final heading: exact yaw would
      # make a differential-drive robot rotate on the spot and slip on tile.
      yaw_goal_tolerance: 0.35
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Keep a small forward component during every normal DWB turn. Together
      # with max_vel_theta=0.90 and the 0.22884 m wheelbase, the inside wheel
      # remains moving forward instead of reversing for an on-the-spot pivot.
      min_vel_x: 0.12
      min_vel_y: 0.0
      max_vel_x: 0.60
      max_vel_y: 0.0
      max_vel_theta: 0.90
      min_speed_xy: 0.12
      max_speed_xy: 0.60
      min_speed_theta: 0.0
      acc_lim_x: 1.50
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.50
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 22
      vy_samples: 1
      vtheta_samples: 28
      sim_time: 1.4
      linear_granularity: 0.015
      angular_granularity: 0.02
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      # RotateToGoal is intentionally omitted. On Humble that critic explicitly
      # rejects translation near the goal and forces a pure rotation in place.
      critics: ["Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.12
      PathAlign.scale: 28.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 30.0
      GoalDist.scale: 18.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.3

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.2
    # Recovery spin is retained for now, but slowed down. Normal path following
    # no longer rotates in place. If recovery spin is observed, we will replace
    # the default recovery tree with one that has no Spin action at all.
    max_rotational_vel: 0.55
    min_rotational_vel: 0.25
    rotational_acc_lim: 1.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.02
      robot_radius: 0.17
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.10
          obstacle_max_range: 4.5
          obstacle_min_range: 0.10
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.34
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.02
      track_unknown_space: true
      robot_radius: 0.17
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.10
          obstacle_max_range: 4.5
          obstacle_min_range: 0.10
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.34
      always_send_full_costmap: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.60, 0.0, 0.90]
    min_velocity: [-0.18, 0.0, -0.90]
    max_accel: [1.50, 0.0, 2.0]
    max_decel: [-1.50, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.6
